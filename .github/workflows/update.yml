name: Refresh UK cost-of-living data
on:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - 'pipeline/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uk-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh data (failures keep last good data)
        run: python update.py
      - name: Test calculations against the refreshed data
        run: node tests/test_calc.js
      - name: Commit and push (rebase-and-retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh verified UK economic data"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected; rebasing (attempt $attempt/5)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "Push failed after five attempts" >&2; exit 1
