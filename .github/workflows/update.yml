name: Refresh UK economic data and official news
on:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified UK economic data and news"
            git push
          fi
