name: Refresh official news
on:
  schedule:
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories.json data/economic.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official UK news"
            git push
          fi
