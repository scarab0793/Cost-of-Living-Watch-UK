name: Refresh UK economic data and official news
on:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    concurrency:
      group: uk-data-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified UK economic data and news"
            for attempt in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Remote main changed; synchronising and retrying ($attempt/5)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
            echo "Push failed after five attempts" >&2
            exit 1
          fi
